name: Patch desk swap cleanup

# Triggered once to apply exact cleanup replacements, then deletes itself.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-desk-swap-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact DeskSwapForm cleanup patch
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, from, to) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(from)) {
              throw new Error(`Missing expected text in ${path}:\n${from}`);
            }
            text = text.replace(from, to);
            fs.writeFileSync(path, text);
          }

          const form = 'components/PageExchange/DeskSwapForm.tsx';
          const order = 'utils/cowDeskOrder.ts';

          replaceOnce(
            form,
            '\tisBaseUsdcToZchfExecutionRoute,\n',
            '\tisDeskExecutionRoute,\n'
          );

          replaceOnce(
            form,
            'const isExecutionRoute = Boolean(route && isBaseUsdcToZchfExecutionRoute(chainId, mode, counterAssetId));',
            'const isExecutionRoute = Boolean(route && isDeskExecutionRoute(chainId, mode, counterAssetId));'
          );

          replaceOnce(
            form,
            'if (!isExecutionRoute) return { actionTitle: "Quote only for this route", actionDescription: "Base USDC ↔ ZCHF can trade now. Other routes are quote-only for the moment." };',
            'if (!isExecutionRoute) return { actionTitle: "Quote only for this route", actionDescription: "This route is not enabled for execution yet." };'
          );

          replaceOnce(
            form,
            'isExecutionRoute\n\t\t\t\t\t\t\t? quoteFoundExecutionCopy\n\t\t\t\t\t\t\t: "This route is quote-only for now. We are enabling Base USDC ↔ ZCHF first, then expanding carefully."',
            'isExecutionRoute\n\t\t\t\t\t\t\t? quoteFoundExecutionCopy\n\t\t\t\t\t\t\t: "This route is quote-only for now. Execution is not enabled for this route."'
          );

          replaceOnce(
            form,
            'function isOrderExpiredOrCancelled(value: any) {\n\tconst status = getOrderStatusLabel(value).toLowerCase();\n\treturn status === "expired" || status === "cancelled" || status === "canceled";\n}\n',
            'function isOrderExpiredOrCancelled(value: any) {\n\tconst status = getOrderStatusLabel(value).toLowerCase();\n\treturn status === "expired" || status === "cancelled" || status === "canceled";\n}\n\nfunction isOrderTerminal(value: any) {\n\treturn isOrderComplete(value) || isOrderExpiredOrCancelled(value);\n}\n'
          );

          replaceOnce(
            form,
            '\tuseEffect(() => {\n\t\tif (!submittedOrderUid) return;\n\n\t\tlet cancelled = false;\n\t\tconst orderUid = submittedOrderUid;\n\n\t\tasync function poll() {\n\t\t\ttry {\n\t\t\t\tsetIsCheckingOrderStatus(true);\n\t\t\t\tconst result = await requestDeskOrderStatus(chainId, orderUid);\n\t\t\t\tif (!cancelled) setOrderStatus(result);\n\t\t\t} catch (error) {\n\t\t\t\tif (!cancelled) {\n\t\t\t\t\tsetExecutionError(getFriendlyError(error, "Could not refresh order status."));\n\t\t\t\t}\n\t\t\t} finally {\n\t\t\t\tif (!cancelled) setIsCheckingOrderStatus(false);\n\t\t\t}\n\t\t}\n\n\t\tpoll();\n\t\tconst interval = window.setInterval(poll, 10_000);\n\n\t\treturn () => {\n\t\t\tcancelled = true;\n\t\t\twindow.clearInterval(interval);\n\t\t};\n\t}, [chainId, submittedOrderUid]);',
            '\tuseEffect(() => {\n\t\tif (!submittedOrderUid || (orderStatus && isOrderTerminal(orderStatus))) return;\n\n\t\tlet cancelled = false;\n\t\tlet interval: ReturnType<typeof window.setInterval> | null = null;\n\t\tconst orderUid = submittedOrderUid;\n\n\t\tasync function poll() {\n\t\t\ttry {\n\t\t\t\tsetIsCheckingOrderStatus(true);\n\t\t\t\tconst result = await requestDeskOrderStatus(chainId, orderUid);\n\t\t\t\tif (!cancelled) {\n\t\t\t\t\tsetOrderStatus(result);\n\t\t\t\t\tif (isOrderTerminal(result) && interval) {\n\t\t\t\t\t\twindow.clearInterval(interval);\n\t\t\t\t\t\tinterval = null;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} catch (error) {\n\t\t\t\tif (!cancelled) {\n\t\t\t\t\tsetExecutionError(getFriendlyError(error, "Could not refresh order status."));\n\t\t\t\t}\n\t\t\t} finally {\n\t\t\t\tif (!cancelled) setIsCheckingOrderStatus(false);\n\t\t\t}\n\t\t}\n\n\t\tpoll();\n\t\tinterval = window.setInterval(poll, 10_000);\n\n\t\treturn () => {\n\t\t\tcancelled = true;\n\t\t\tif (interval) window.clearInterval(interval);\n\t\t};\n\t}, [chainId, orderStatus, submittedOrderUid]);'
          );

          replaceOnce(
            order,
            '/** @deprecated Use isDeskExecutionRoute. Kept until DeskSwapForm is split/refactored. */\nexport function isBaseUsdcToZchfExecutionRoute(chainId: number, mode?: DeskSwapMode, counterAssetId?: string) {\n\treturn isDeskExecutionRoute(chainId, mode, counterAssetId);\n}\n\n',
            ''
          );

          fs.rmSync('.github/workflows/patch-desk-swap-cleanup.yml', { force: true });
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/PageExchange/DeskSwapForm.tsx utils/cowDeskOrder.ts .github/workflows/patch-desk-swap-cleanup.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean up desk swap execution state"
            git push
          fi
